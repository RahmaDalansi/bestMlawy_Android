plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.bestmlawi'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.bestmlawi"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX Core
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.activity
    implementation libs.drawerlayout

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Firebase BOM (Bill of Materials) - Gère automatiquement les versions compatibles
    implementation(platform("com.google.firebase:firebase-bom:32.7.0"))

    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation "com.google.firebase:firebase-storage"

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Material Design (version spécifique pour compatibilité)
    implementation 'com.google.android.material:material:1.9.0'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Barcode Scanning
    implementation libs.barcode.scanning.common
    implementation libs.play.services.code.scanner
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Dashboard Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // AppCompat (version spécifique)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ConstraintLayout (version spécifique)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation (versions spécifiques)
    implementation 'androidx.navigation:navigation-fragment:2.7.0'
    implementation 'androidx.navigation:navigation-ui:2.7.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}